<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caelus Weather</title>
  </head>
  <body>
    <header>
      <div id="logo">
        <h1>Caelus</h1>
        <h2>Weather</h2>
      </div>

      <div id="search">
        <input
          id="input-location"
          name="inputLocation"
          placeholder="Search for a location"
        />
        <button id="btn-search">Search</button>
      </div>
      <button id="btn-unit-sys">C°</button>
    </header>

    <div id="content">
      <div id="overview">
        <div id="overview-header">
          <h2 id="overview-location">Location</h2>
          <h2 id="overview-conditions">Overview condition</h2>
        </div>
        <div id="overview-info-main">
          <div id="overview-temp-container">
            <h1 id="overview-temp">99°</h1>
            <h3 id="overview-temp-feels-like">Feels like 99°C</h3>
            <h3>Now</h3>
          </div>
          <div id="overview-info-more">
            <div id="overview-precip-chance-container" class="more-info">
              <p id="overview-precip-chance-header">Precipitation %</p>
              <p id="overview-precip-chance">100%</p>
            </div>
            <div id="overview-humidity-container" class="more-info">
              <p>Humidity</p>
              <p id="overview-humidity">100%</p>
            </div>
            <div id="overview-uv-index-container" class="more-info">
              <p>UV Index</p>
              <p id="overview-uv-index">10.0</p>
            </div>
            <div id="overview-wind-speed-container" class="more-info">
              <p>Wind Speed</p>
              <p id="overview-wind-speed">100 km/h</p>
            </div>
          </div>
        </div>
        <div id="forecast-hourly"></div>
      </div>
      <div id="forecast-daily-container">
        <h1>Daily Forecast</h1>
        <div id="forecast-daily"></div>
      </div>
    </div>

    <footer>
      <p>This is the footer</p>
    </footer>
  </body>
</html>
